name: JavaScript core compilation and runtime

on:
  push:
    paths:
      - 'lib/sys/js/core/**'
      - 'lib/sys/js/jsc.lib.js'
      - '.github/workflows/js-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current product
        uses: actions/checkout@v4
      - name: Check out permanent tests at known revision
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: b6b72053a26d3a4c6ad71e1e0bea4a9ce7ea6af0
          path: .js-core-test-suite
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use canonical product origin for target identity
        run: git remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
      - name: Exercise real compiler and core browser/CommonJS API
        shell: bash
        run: |
          export RUMIAI_TEST_RUMIAI_OS_ROOT="$GITHUB_WORKSPACE"
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          CHROMIUM="$chrome" ./.js-core-test-suite/tests/rumiai-os/js-core/compile.test
