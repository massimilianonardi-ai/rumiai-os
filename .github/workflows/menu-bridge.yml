name: Menu bridge snapshot

on:
  push:
    branches:
      - main

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 24a6c14ed564099f358dc0ed53c70d8bba0d93ab
          fetch-depth: 1
      - name: Verify exact revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "24a6c14ed564099f358dc0ed53c70d8bba0d93ab"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Package checkout
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/rumiai-os-24a6c14ed564099f358dc0ed53c70d8bba0d93ab.tar.gz"
          tar -czf "$archive" .
          sha256sum "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: rumiai-os-menu-bridge
          path: |
            ${{ runner.temp }}/rumiai-os-24a6c14ed564099f358dc0ed53c70d8bba0d93ab.tar.gz
            ${{ runner.temp }}/rumiai-os-24a6c14ed564099f358dc0ed53c70d8bba0d93ab.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
