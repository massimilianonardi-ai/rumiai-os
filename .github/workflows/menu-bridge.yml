name: Menu bridge snapshot

on:
  push:
    branches:
      - main

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 17b5fcf6c86417e8d2c0eacbd3cb9c2bf2fa5457
          fetch-depth: 1
      - name: Normalize and verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          git remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          test "$(git rev-parse HEAD)" = "17b5fcf6c86417e8d2c0eacbd3cb9c2bf2fa5457"
          test "$(git config --get remote.origin.url)" = "https://github.com/massimilianonardi-ai/rumiai-os.git"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Package checkout
        shell: bash
        run: |
          set -euo pipefail
          name="rumiai-os-17b5fcf6c86417e8d2c0eacbd3cb9c2bf2fa5457.tar.gz"
          archive="$RUNNER_TEMP/$name"
          tar -czf "$archive" .
          digest="$(sha256sum "$archive" | awk '{print $1}')"
          (cd "$RUNNER_TEMP" && printf '%s  %s\n' "$digest" "$name" > "$name.sha256")
          {
            printf 'repository\t%s\n' 'massimilianonardi-ai/rumiai-os'
            printf 'commit\t%s\n' '17b5fcf6c86417e8d2c0eacbd3cb9c2bf2fa5457'
            printf 'origin\t%s\n' 'https://github.com/massimilianonardi-ai/rumiai-os.git'
            printf 'archive\t%s\n' "$name"
            printf 'sha256\t%s\n' "$digest"
          } > "$RUNNER_TEMP/manifest"
      - uses: actions/upload-artifact@v4
        with:
          name: rumiai-os-menu-bridge
          path: |
            ${{ runner.temp }}/rumiai-os-17b5fcf6c86417e8d2c0eacbd3cb9c2bf2fa5457.tar.gz
            ${{ runner.temp }}/rumiai-os-17b5fcf6c86417e8d2c0eacbd3cb9c2bf2fa5457.tar.gz.sha256
            ${{ runner.temp }}/manifest
          if-no-files-found: error
          compression-level: 0
