name: m.text.document core extraction verification

on:
  push:
    paths:
      - 'lib/sys/js/core/m/text/document/**'
      - 'lib/sys/js/core/modules-js.json'
      - '.github/workflows/text-document-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  text-document:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current product code
        uses: actions/checkout@v4
      - name: Check out permanent document extraction tests
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: 6f1c34a5dbc31d309ff2d4b39e5cbd9ced761e3c
          path: .text-document-tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify extracted source syntax
        run: |
          node --check lib/sys/js/core/m/text/document/Document.js
          node --check lib/sys/js/core/m/text/document/base.js
          node --check lib/sys/js/core/m/text/document/flat.js
          node --check lib/sys/js/core/m/text/document/piece.js
          node --check .text-document-tests/tests/rumiai-os/text-document/core.test.mjs
          node --check lib/sys/js/text-edit.lib.js
      - name: Verify actual core compiler and extracted document semantics
        run: |
          git remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          RUMIAI_TEST_RUMIAI_OS_ROOT="$GITHUB_WORKSPACE" ./.text-document-tests/tests/rumiai-os/text-document/core.test
