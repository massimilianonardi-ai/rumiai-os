name: TextEdit standalone library verification

on:
  push:
    paths:
      - 'lib/sys/js/text-edit.lib.js'
      - 'res/sys/manual/text-edit.lib.js'
      - '.github/workflows/text-edit.yml'
  pull_request:
    paths:
      - 'lib/sys/js/text-edit.lib.js'
      - 'res/sys/manual/text-edit.lib.js'
      - '.github/workflows/text-edit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  text-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out real product
        uses: actions/checkout@v4
      - name: Check out permanent test sources
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: b8d5cbea34784d1a42af2b00bf22c09fec9d478c
          path: .text-edit-tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source syntax
        run: node --check lib/sys/js/text-edit.lib.js
      - name: Normalize product Git origin for canonical target discovery
        run: git remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
      - name: Test TextEditBase, selections, representation and column geometry
        run: |
          RUMIAI_TEST_RUMIAI_OS_ROOT="$GITHUB_WORKSPACE" ./.text-edit-tests/tests/rumiai-os/text-edit/core.test
      - name: Create standalone distribution archive
        run: |
          mkdir -p dist
          cp lib/sys/js/text-edit.lib.js dist/text-edit.lib.js
          cp res/sys/manual/text-edit.lib.js dist/README.txt
          cd dist
          zip -q -9 ../TextEdit-v0.8.2.zip text-edit.lib.js README.txt
      - name: Publish installable release archive
        uses: actions/upload-artifact@v4
        with:
          name: TextEdit-v0.8.2
          path: TextEdit-v0.8.2.zip
          if-no-files-found: error

  publish-release:
    name: Publish TextEdit v0.8.2
    if: github.ref == 'refs/heads/release/text-edit-v0.8.2'
    needs: text-edit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download exactly validated distribution
        uses: actions/download-artifact@v4
        with:
          name: TextEdit-v0.8.2
      - name: Create immutable version tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view text-edit-v0.8.2 --repo massimilianonardi-ai/rumiai-os >/dev/null 2>&1; then
            echo 'TextEdit v0.8.2 release already exists; refusing to overwrite'
            exit 1
          fi
          gh release create text-edit-v0.8.2 TextEdit-v0.8.2.zip \
            --repo massimilianonardi-ai/rumiai-os \
            --target "$GITHUB_SHA" \
            --title "TextEdit v0.8.2" \
            --notes "TextEdit v0.8.2: finalized standalone GUI-independent text core. Oriented post-edit carets: forward at payload end and reverse at payload start; lineSelection always constructs a forward selection. Virtual/clipped selection geometry remains supported. Input grapheme reversal, GUI and host adapters remain separate."
