name: TextEdit standalone library verification

on:
  push:
    paths:
      - 'lib/sys/js/text-edit.lib.js'
      - 'res/sys/manual/text-edit.lib.js'
      - '.github/workflows/text-edit.yml'
  pull_request:
    paths:
      - 'lib/sys/js/text-edit.lib.js'
      - 'res/sys/manual/text-edit.lib.js'
      - '.github/workflows/text-edit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  text-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out real product
        uses: actions/checkout@v4
      - name: Check out permanent test sources
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: ef143cb7f4423dfa000a29c3069165da326c2292
          path: .text-edit-tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source syntax
        run: node --check lib/sys/js/text-edit.lib.js
      - name: Normalize product Git origin for canonical target discovery
        run: git remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
      - name: Test source-mapped representation, selections and TextEditBase stores
        run: |
          RUMIAI_TEST_RUMIAI_OS_ROOT="$GITHUB_WORKSPACE" ./.text-edit-tests/tests/rumiai-os/text-edit/core.test
      - name: Create standalone distribution archive
        run: |
          mkdir -p dist
          cp lib/sys/js/text-edit.lib.js dist/text-edit.lib.js
          cp res/sys/manual/text-edit.lib.js dist/README.txt
          cd dist
          zip -q -9 ../TextEdit-v0.5.0.zip text-edit.lib.js README.txt
      - name: Publish installable release archive
        uses: actions/upload-artifact@v4
        with:
          name: TextEdit-v0.5.0
          path: TextEdit-v0.5.0.zip
          if-no-files-found: error

  publish-release:
    name: Publish TextEdit v0.5.0
    if: github.ref == 'refs/heads/release/text-edit-v0.5.0'
    needs: text-edit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download exactly validated distribution
        uses: actions/download-artifact@v4
        with:
          name: TextEdit-v0.5.0
      - name: Create immutable version tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view text-edit-v0.5.0 --repo massimilianonardi-ai/rumiai-os >/dev/null 2>&1; then
            echo 'TextEdit v0.5.0 release already exists; refusing to overwrite'
            exit 1
          fi
          gh release create text-edit-v0.5.0 TextEdit-v0.5.0.zip \
            --repo massimilianonardi-ai/rumiai-os \
            --target "$GITHUB_SHA" \
            --title "TextEdit v0.5.0" \
            --notes "TextEdit v0.5.0: representation-owned grapheme, tab-stop and source-row column mapping with explicit ambiguity/virtual-column results; advanced line and rectangular selections share {row,col} start/end coordinates with inclusive row/cell semantics. Existing source, selection and representation contracts remain independent of GUI and history."
