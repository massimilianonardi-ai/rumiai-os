name: Validate final pkg catalog matrix

on:
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 8a179b38b07fbd35e475b7df6b8f05e976cc0fdb
          path: product
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: f5fbc0e6b56212d4afa2d0fae91a5cf31ee2f830
          path: suite
          fetch-depth: 1
          persist-credentials: false

      - name: Run final package catalog matrix
        shell: sh
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/product
        run: |
          set -eu
          git -C product remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          git -C suite remote set-url origin https://github.com/massimilianonardi-ai/rumiai-tests.git
          product/m "$PWD/product/bin/sys/osarch-update"
          test "$(readlink product/bin/ext-osarch)" = ext-linux-x86_64
          cd suite
          set +e
          ./rumiai-test -- external
          status=$?
          set -e
          if [ "$status" -ne 0 ]
          then
            find .runs -type f -path '*/logs/external/*/install-live.test.log' -print |
              LC_ALL=C sort |
              while IFS= read -r log
              do
                printf '\n===== %s =====\n' "$log"
                cat "$log"
              done
          fi
          exit "$status"
