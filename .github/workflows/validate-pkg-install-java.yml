name: Validate pkg install Java

on:
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 8a179b38b07fbd35e475b7df6b8f05e976cc0fdb
          path: product
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: c864d3080e22fcdce50877823aa5f741ef98b3f0
          path: suite
          fetch-depth: 1
          persist-credentials: false

      - name: Run package install validation
        shell: sh
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/product
        run: |
          set -eu
          git -C product remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          git -C suite remote set-url origin https://github.com/massimilianonardi-ai/rumiai-tests.git
          product/m "$PWD/product/bin/sys/osarch-update"
          test "$(readlink product/bin/ext-osarch)" = ext-linux-x86_64
          cd suite

          run_one()
          {
            selection=$1
            set +e
            ./rumiai-test -- "$selection"
            status=$?
            set -e
            if [ "$status" -ne 0 ]
            then
              log=$(find .runs -type f -path "*/logs/$selection.log" -print | LC_ALL=C sort | tail -n 1)
              [ -z "$log" ] || cat "$log"
              exit "$status"
            fi
          }

          run_one rumiai-os/pkg-repository-temurin/contract.test
          run_one external/java/install-live.test
