name: Validate pkg install catalog matrix

on:
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 25ab0e5a5b8267af715f320bd9ee17405a2b41f6
          path: product
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: ab331c94371c7146eb2feeab8d1036f0c4ad13fd
          path: suite
          fetch-depth: 1
          persist-credentials: false

      - name: Run package install catalog matrix
        shell: sh
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/product
        run: |
          set -eu
          git -C product remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          git -C suite remote set-url origin https://github.com/massimilianonardi-ai/rumiai-tests.git
          product/m "$PWD/product/bin/sys/osarch-update"
          test "$(readlink product/bin/ext-osarch)" = ext-linux-x86_64
          cd suite

          overall=0
          run_one()
          {
            selection=$1
            set +e
            ./rumiai-test -- "$selection"
            status=$?
            set -e
            if [ "$status" -ne 0 ]
            then
              log=$(find .runs -type f -path "*/logs/$selection.log" -print | LC_ALL=C sort | tail -n 1)
              if [ -n "$log" ]
              then
                printf '\n===== %s =====\n' "$selection"
                cat "$log"
              fi
              [ "$status" -le "$overall" ] || overall=$status
            fi
          }

          run_one external/chrome/install-live.test
          run_one external/chromium/install-live.test
          run_one external/dbeaver/install-live.test
          run_one external/electron/install-live.test
          run_one external/graalvm/install-live.test
          run_one external/java/install-live.test
          run_one external/jq/release-live.test
          run_one external/keycloak/install-live.test
          run_one external/maven/install-live.test
          run_one external/micromamba/release-live.test
          run_one external/netbeans/install-live.test
          run_one external/nodejs/release-live.test
          run_one external/pulsar/install-live.test

          exit "$overall"
