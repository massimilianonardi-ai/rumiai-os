name: pkg-state-empty-directory-regression

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/pkg-install-vm-transfer-20260917

jobs:
  state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: fe2151999ffba98d9921e1c62662c270adc0cfa0
          path: product
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: bb9dabd2d6d256c956f8457daaa54ab06ffc29c8
          path: suite
          fetch-depth: 1
          persist-credentials: false

      - name: Run package state regression
        shell: sh
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/product
        run: |
          set -eu
          git -C product remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          git -C suite remote set-url origin https://github.com/massimilianonardi-ai/rumiai-tests.git
          cd suite
          set +e
          ./rumiai-test -- rumiai-os/pkg/state.test
          status=$?
          set -e
          if [ "$status" -ne 0 ]
          then
            log=$(find .runs -type f -path '*/logs/rumiai-os/pkg/state.test.log' -print | LC_ALL=C sort | tail -n 1)
            [ -z "$log" ] || cat "$log"
          fi
          exit "$status"
