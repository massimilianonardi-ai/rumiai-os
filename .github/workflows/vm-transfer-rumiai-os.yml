name: vm-transfer-rumiai-os

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/pkg-install-vm-transfer-20260917

jobs:
  validate-pkg-install-batch-semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 5e47a3f0a242a57f8431fece2357532c19342cd9
          path: product
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: 13867b6e82b33b16c0316f844be77419354815fa
          path: suite
          fetch-depth: 1
          persist-credentials: false
      - name: Syntax
        shell: sh
        run: |
          set -eu
          sh -n product/lib/sys/sh/pkg-install.lib.sh
          sh -n suite/tests/rumiai-os/pkg/install-live.test
      - name: Dependency and uninstall regression
        shell: sh
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/product
        run: |
          set -eu
          git -C product remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          suite/tests/rumiai-os/pkg/dependency.test
          suite/tests/rumiai-os/pkg/uninstall.test
      - name: Live install batch semantics
        shell: sh
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/product
        run: |
          set -eu
          suite/tests/rumiai-os/pkg/install-live.test
