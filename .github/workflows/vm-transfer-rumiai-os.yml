name: vm-transfer-rumiai-os

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/pkg-install-vm-transfer-20260917

jobs:
  validate-pkg-entrypoints-and-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 928204107647d97db385e4473cd73530924fd4dd
          path: product
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: 0479206f73f658abd4bd8e226c20c14e192c3e73
          path: suite
          fetch-depth: 1
          persist-credentials: false
      - name: Syntax
        shell: sh
        run: |
          set -eu
          sh -n product/lib/sys/sh/pkg-integration.lib.sh
          sh -n product/lib/sys/sh/pkg-default.lib.sh
          sh -n product/lib/sys/sh/pkg-uninstall.lib.sh
          sh -n product/lib/sys/sh/pkg-install.lib.sh
          sh -n suite/tests/rumiai-os/pkg/default.test
          sh -n suite/tests/rumiai-os/pkg/dependency.test
          sh -n suite/tests/rumiai-os/pkg/uninstall.test
          sh -n suite/tests/rumiai-os/pkg-integration/contract.test
          sh -n suite/tests/rumiai-os/pkg/install-live.test
      - name: Selected package tests
        shell: sh
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/product
        run: |
          set -eu
          suite/tests/rumiai-os/pkg/default.test
          suite/tests/rumiai-os/pkg/dependency.test
          suite/tests/rumiai-os/pkg/uninstall.test
          suite/tests/rumiai-os/pkg-integration/contract.test
          suite/tests/rumiai-os/pkg/install-live.test
