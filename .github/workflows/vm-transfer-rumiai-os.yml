name: keycloak-permanent-install-test

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/pkg-install-vm-transfer-20260917

jobs:
  keycloak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: fe2151999ffba98d9921e1c62662c270adc0cfa0
          path: product
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: 1fbd3eab0507179417d0f78122a5d4f54b4a0468
          path: suite
          fetch-depth: 1
          persist-credentials: false

      - name: Run permanent Keycloak install test
        shell: sh
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/product
        run: |
          set -eu
          git -C product remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          git -C suite remote set-url origin https://github.com/massimilianonardi-ai/rumiai-tests.git
          product/m "$PWD/product/bin/sys/osarch-update"
          test "$(readlink product/bin/ext-osarch)" = ext-linux-x86_64

          cd suite
          set +e
          ./rumiai-test -- external/keycloak/install-live.test
          status=$?
          set -e
          if [ "$status" -ne 0 ]
          then
            log=$(find .runs -type f -path '*/logs/external/keycloak/install-live.test.log' -print | LC_ALL=C sort | tail -n 1)
            [ -z "$log" ] || cat "$log"
          fi
          exit "$status"
