name: pkg-install-final-catalog-matrix

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/pkg-install-vm-transfer-20260917

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - chrome
          - chromium
          - dbeaver
          - electron
          - graalvm
          - jq
          - keycloak
          - maven
          - micromamba
          - netbeans
          - nodejs
          - pulsar
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 8177082a4254774db96d94aff2aff3d971da659f
          path: product
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize exact target
        shell: sh
        run: |
          set -eu
          cd product
          git remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          test "$(git rev-parse HEAD)" = 8177082a4254774db96d94aff2aff3d971da659f
          ./m "$PWD/bin/sys/osarch-update"
          test "$(readlink bin/ext-osarch)" = ext-linux-x86_64

      - name: Install and validate ${{ matrix.package }}
        shell: sh
        run: |
          set -eu
          cd product
          pkg='${{ matrix.package }}'

          java_identity=
          case "$pkg" in
            keycloak|maven|netbeans)
              ./m pkg install graalvm
              java_identity=$(./m pkg default graalvm)
              [ -n "$java_identity" ]
              ;;
          esac

          if [ "$pkg" = keycloak ]
          then
            set +e
            sh -x ./m pkg install keycloak >../keycloak.out 2>../keycloak.trace
            status=$?
            set -e
            [ "$status" -eq 1 ]
            grep -F 'pkg_state_path=data' ../keycloak.trace >/dev/null
            grep -F '_pkg_state_source_type_set' ../keycloak.trace | grep -F ' data' >/dev/null
            if ./m pkg versions keycloak >/dev/null 2>&1
            then
              printf '%s\n' 'Keycloak unexpectedly installed despite unresolved data-state mapping' >&2
              exit 1
            fi
            printf 'BLOCKED package=keycloak reason=missing-upstream-data-directory status=%s java=%s\n' "$status" "$java_identity"
            exit 0
          fi

          ./m pkg install "$pkg"
          identity=$(./m pkg default "$pkg")
          [ -n "$identity" ]
          ./m pkg versions "$pkg" | grep -Fx "$identity" >/dev/null

          concrete="$PWD/pkg/$identity"
          [ -d "$concrete" ] && [ ! -L "$concrete" ]
          [ -d "$concrete/root" ] && [ ! -L "$concrete/root" ]

          if [ -d "$concrete/cmd" ]
          then
            for command_path in "$concrete/cmd"/*
            do
              [ -e "$command_path" ] || [ -L "$command_path" ] || continue
              command_name=${command_path##*/}
              [ -f "$command_path" ] && [ ! -L "$command_path" ] && [ -x "$command_path" ]
              [ -L "$concrete/link/$command_name" ]
              [ -L "$PWD/bin/ext-linux-x86_64/$command_name" ]
            done
          fi

          check_setuid()
          {
            target=$1
            [ -f "$target" ] && [ ! -L "$target" ]
            listing=$(LC_ALL=C ls -ldn "$target")
            set -- $listing
            [ "$#" -ge 4 ]
            [ "$3" = 0 ] && [ "$4" = 0 ]
            mode_match=$(find "$target" -prune -perm 4755 -print)
            [ "$mode_match" = "$target" ]
          }

          case "$pkg" in
            chrome)
              check_setuid "$concrete/root/opt/google/chrome/chrome-sandbox"
              ;;
            chromium)
              check_setuid "$concrete/root/chrome_sandbox"
              ;;
            electron|pulsar)
              check_setuid "$concrete/root/chrome-sandbox"
              ;;
            graalvm)
              [ "$(cat "$concrete/facility")" = 'java 25' ]
              [ -x "$concrete/root/bin/java" ]
              [ -x "$concrete/root/bin/javac" ]
              "$concrete/root/bin/java" -version >/dev/null 2>&1
              "$concrete/root/bin/javac" -version >/dev/null 2>&1
              provider_root=$(./m "$PWD/bin/sys/state-path" system sys pkg data)
              marker="$provider_root/providers/java/25/$identity"
              [ -f "$marker" ] && [ ! -L "$marker" ] && [ ! -s "$marker" ]
              ;;
            jq)
              ./m jq --version
              ;;
            maven)
              [ "$(cat "$concrete/binding/java")" = "$java_identity" ]
              [ -f "$concrete/env" ] && [ ! -L "$concrete/env" ]
              ./m mvn --version
              ;;
            micromamba)
              ./m micromamba --version
              ;;
            netbeans)
              [ "$(cat "$concrete/binding/java")" = "$java_identity" ]
              [ -f "$concrete/env" ] && [ ! -L "$concrete/env" ]
              ;;
            nodejs)
              [ -f "$concrete/env" ] && [ ! -L "$concrete/env" ]
              ./m node --version
              ./m npm --version
              ./m npx --version
              ;;
          esac

          printf 'PASS package=%s identity=%s\n' "$pkg" "$identity"
