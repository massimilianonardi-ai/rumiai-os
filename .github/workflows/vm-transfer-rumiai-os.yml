name: vm-transfer-rumiai-os

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/pkg-install-vm-transfer-20260917

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task controls
        uses: actions/checkout@v4
        with:
          ref: tmp/pkg-install-vm-transfer-20260917
          path: control
          persist-credentials: false

      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 0

      - name: Apply verified correction
        shell: sh
        run: sh control/.github/scripts/apply-pkg-store-fix.sh source
