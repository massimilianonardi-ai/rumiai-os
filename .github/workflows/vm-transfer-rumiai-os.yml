name: vm-transfer-rumiai-os

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/pkg-install-vm-transfer-20260917

jobs:
  diagnose-default-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: eae5a7203fab8676e5914f073c2ab9e0c124dddf
          path: product
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: d2c487ecdfb672ac7343019098fda98381f5cf82
          path: suite
          fetch-depth: 1
          persist-credentials: false
      - name: Install then call pkg_default_command
        shell: sh
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -eu
          . suite/lib/rumiai-os-fixture.lib
          fixture="$RUNNER_TEMP/rumiai-pkg-default-function"
          rumiai_test_fixture_rumiai_os_create "$GITHUB_WORKSPACE/product" "$fixture"
          PATH="$fixture/bin/sys:$PATH"
          export PATH

          "$fixture/bin/sys/pkg" install 'jq@jq-1.8.2'

          probe="$fixture/default-probe"
          printf '%s\n'             '#!/usr/bin/env m'             '. "$m_LIB_DIR/sys/sh/osarch.lib.sh"'             '. "$m_LIB_DIR/sys/sh/pkg-default.lib.sh"'             "pkg_default_command 'jq@jq-1.8.2'" > "$probe"
          chmod +x "$probe"
          "$probe"

          printf 'selector=%s\n' "$(readlink "$fixture/pkg/jq!linux-x86_64")"
          printf 'public=%s\n' "$(readlink "$fixture/bin/ext-linux-x86_64/jq")"
          "$fixture/bin/ext-linux-x86_64/jq" --version
