name: pkg-install-current-regression

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/pkg-install-vm-transfer-20260917

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 8177082a4254774db96d94aff2aff3d971da659f
          path: product
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: 7529f88269b1c8b60e58e56235dfd4ff64aca1f2
          path: suite
          fetch-depth: 1
          persist-credentials: false
      - name: Package regression
        shell: sh
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/product
        run: |
          set -eu
          git -C product remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          for test_path in suite/tests/rumiai-os/pkg/*.test
          do
            printf 'RUN %s\n' "$test_path"
            "$test_path"
          done
          for test_path in suite/tests/rumiai-os/pkg-repository-chrome/*.test
          do
            printf 'RUN %s\n' "$test_path"
            "$test_path"
          done
          printf '%s\n' 'RUN suite/tests/rumiai-os/pkg-integration/contract.test'
          suite/tests/rumiai-os/pkg-integration/contract.test
