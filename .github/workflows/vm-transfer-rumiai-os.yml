name: keycloak-archive-shape

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/pkg-install-vm-transfer-20260917

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Compare Keycloak release archives
        shell: sh
        run: |
          set -eu
          base=https://github.com/keycloak/keycloak/releases/download/26.7.4
          curl -fL -o keycloak.tar.gz "$base/keycloak-26.7.4.tar.gz"
          curl -fL -o keycloak.zip "$base/keycloak-26.7.4.zip"
          printf '%s\n' 'TAR_DATA_BEGIN'
          tar -tzf keycloak.tar.gz | grep '^keycloak-26.7.4/data\(/|$\)' || :
          printf '%s\n' 'TAR_DATA_END'
          printf '%s\n' 'ZIP_DATA_BEGIN'
          unzip -Z1 keycloak.zip | grep '^keycloak-26.7.4/data\(/|$\)' || :
          printf '%s\n' 'ZIP_DATA_END'
