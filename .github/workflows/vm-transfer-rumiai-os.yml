name: vm-transfer-rumiai-os

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/pkg-install-vm-transfer-20260917

jobs:
  pkg-install-current:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current rumiai-os target
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: db0b25c20b08247cd68818ef9caea61a1cf02451
          path: product
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout current rumiai-tests suite
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: d2c487ecdfb672ac7343019098fda98381f5cf82
          path: suite
          fetch-depth: 1
          persist-credentials: false

      - name: Verify and run targeted coverage
        shell: sh
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/product
          TMPDIR: ${{ runner.temp }}
        run: |
          set -eu
          test "$(git -C product rev-parse HEAD)" = "db0b25c20b08247cd68818ef9caea61a1cf02451"
          test "$(git -C suite rev-parse HEAD)" = "d2c487ecdfb672ac7343019098fda98381f5cf82"
          git -C product remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          sh -n suite/lib/rumiai-os-fixture.lib
          sh -n suite/tests/rumiai-tests/lib/rumiai-os-fixture-reference.test
          sh -n suite/tests/rumiai-os/pkg/install-live.test
          suite/tests/rumiai-tests/lib/rumiai-os-fixture-reference.test
          suite/tests/rumiai-os/pkg/install-live.test
