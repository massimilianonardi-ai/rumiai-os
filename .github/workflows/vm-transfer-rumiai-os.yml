name: vm-transfer-rumiai-os

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/pkg-install-vm-transfer-20260917

jobs:
  trace-pkg-install-one:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact rumiai-os revision
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: eae5a7203fab8676e5914f073c2ab9e0c124dddf
          path: product
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact rumiai-tests revision
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: d2c487ecdfb672ac7343019098fda98381f5cf82
          path: suite
          fetch-depth: 1
          persist-credentials: false

      - name: Trace pkg install
        shell: sh
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -u
          test "$(git -C product rev-parse HEAD)" = "eae5a7203fab8676e5914f073c2ab9e0c124dddf" || exit 1
          test "$(git -C suite rev-parse HEAD)" = "d2c487ecdfb672ac7343019098fda98381f5cf82" || exit 1
          git -C product remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git

          . suite/lib/rumiai-os-fixture.lib
          fixture="$RUNNER_TEMP/rumiai-pkg-trace"
          rumiai_test_fixture_rumiai_os_create "$GITHUB_WORKSPACE/product" "$fixture" || exit 1

          PATH="$fixture/bin/sys:$PATH"
          export PATH

          set +e
          sh -x "$fixture/m" "$fixture/bin/sys/pkg" install 'jq@jq-1.8.2'
          status=$?
          set -e
          printf 'PKG_STATUS=%s\n' "$status"
          exit "$status"
