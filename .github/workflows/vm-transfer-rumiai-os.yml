name: pkg-install-nodejs-retry

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/pkg-install-vm-transfer-20260917

jobs:
  nodejs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 8177082a4254774db96d94aff2aff3d971da659f
          path: product
          fetch-depth: 1
          persist-credentials: false
      - name: Retry Node.js through real pkg path
        shell: sh
        run: |
          set -eu
          cd product
          git remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          ./m "$PWD/bin/sys/osarch-update"
          ./m pkg install nodejs
          identity=$(./m pkg default nodejs)
          [ -n "$identity" ]
          concrete="$PWD/pkg/$identity"
          [ -f "$concrete/env" ] && [ ! -L "$concrete/env" ]
          ./m node --version
          ./m npm --version
          ./m npx --version
          printf 'PASS package=nodejs identity=%s\n' "$identity"
