name: pkg-install-catalog-matrix

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/pkg-install-vm-transfer-20260917

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - chrome
          - chromium
          - dbeaver
          - electron
          - graalvm
          - jq
          - keycloak
          - maven
          - micromamba
          - netbeans
          - nodejs
          - pulsar
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 5e47a3f0a242a57f8431fece2357532c19342cd9
          path: product
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize target
        shell: sh
        run: |
          set -eu
          cd product
          git remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          osarch_update="$PWD/bin/sys/osarch-update"
          ./m "$osarch_update"
          test -L bin/ext-osarch
          printf 'OSARCH_SELECTOR=%s\n' "$(readlink bin/ext-osarch)"

      - name: Install ${{ matrix.package }}
        shell: sh
        run: |
          set -u
          cd product
          pkg='${{ matrix.package }}'
          printf 'PACKAGE=%s\n' "$pkg"
          ./m pkg install "$pkg"
          status=$?
          printf 'INSTALL_STATUS=%s\n' "$status"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          printf 'DEFAULT='
          ./m pkg default "$pkg"
          printf 'VERSIONS_BEGIN\n'
          ./m pkg versions "$pkg"
          printf 'VERSIONS_END\n'
          printf 'STORE_BEGIN\n'
          find pkg -maxdepth 3 -mindepth 1 -print | LC_ALL=C sort
          printf 'STORE_END\n'
