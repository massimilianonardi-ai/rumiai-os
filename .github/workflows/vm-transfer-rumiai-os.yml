name: vm-transfer-rumiai-os

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/pkg-install-vm-transfer-20260917

jobs:
  trace-pkg-adjacent-failures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 9e7a67c6406eb2995615f7f53bfe5eedefc9b95b
          path: product
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: ad2606602507ae0b7abd3eae31f7b24fe3ac5bcb
          path: suite
          fetch-depth: 1
          persist-credentials: false
      - name: Trace dependency failure
        shell: sh
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/product
        run: |
          set -u
          git -C product remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          set +e
          sh -x suite/tests/rumiai-os/pkg/dependency.test >dependency.out 2>dependency.trace
          status=$?
          set -e
          printf 'DEPENDENCY_STATUS=%s\n' "$status"
          tail -n 260 dependency.trace
      - name: Trace uninstall failure
        shell: sh
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/product
        run: |
          set -u
          set +e
          sh -x suite/tests/rumiai-os/pkg/uninstall.test >uninstall.out 2>uninstall.trace
          status=$?
          set -e
          printf 'UNINSTALL_STATUS=%s\n' "$status"
          tail -n 220 uninstall.trace
