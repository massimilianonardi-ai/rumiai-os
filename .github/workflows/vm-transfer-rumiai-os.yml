name: chromium-permanent-install-test

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/pkg-install-vm-transfer-20260917

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 8177082a4254774db96d94aff2aff3d971da659f
          path: product
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: 08bae6d721af7a4c7902e3bdb1b1b9e1a9071f08
          path: suite
          fetch-depth: 1
          persist-credentials: false

      - name: Run permanent Chromium install test
        shell: sh
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/product
        run: |
          set -eu
          git -C product remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          git -C suite remote set-url origin https://github.com/massimilianonardi-ai/rumiai-tests.git
          cd suite
          set +e
          ./rumiai-test -- external/chromium/install-live.test
          status=$?
          set -e
          if [ "$status" -ne 0 ]
          then
            log=$(find .runs -type f -path '*/logs/external/chromium/install-live.test' -print | LC_ALL=C sort | tail -n 1)
            [ -z "$log" ] || cat "$log"
          fi
          exit "$status"
