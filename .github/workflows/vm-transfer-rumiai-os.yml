name: vm-transfer-rumiai-os

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/pkg-install-vm-transfer-20260917

jobs:
  final-current-pkg-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 5e47a3f0a242a57f8431fece2357532c19342cd9
          path: product
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: b180c43c27db969c61476f02eb230fcc60a6806e
          path: suite
          fetch-depth: 1
          persist-credentials: false
      - name: Current package regression
        shell: sh
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/product
        run: |
          set -eu
          git -C product remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          for test_path in suite/tests/rumiai-os/pkg/*.test
          do
            printf 'RUN %s\n' "$test_path"
            "$test_path"
          done
          suite/tests/rumiai-os/pkg-integration/contract.test
          suite/tests/rumiai-os/pkg-launch/contract.test
