name: vm-transfer-rumiai-os

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/pkg-install-vm-transfer-20260917

jobs:
  trace-reinstall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: eae5a7203fab8676e5914f073c2ab9e0c124dddf
          path: product
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: d2c487ecdfb672ac7343019098fda98381f5cf82
          path: suite
          fetch-depth: 1
          persist-credentials: false
      - name: Trace second install
        shell: sh
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -u
          . suite/lib/rumiai-os-fixture.lib
          fixture="$RUNNER_TEMP/rumiai-pkg-reinstall"
          rumiai_test_fixture_rumiai_os_create "$GITHUB_WORKSPACE/product" "$fixture" || exit 90
          PATH="$fixture/bin/sys:$PATH"
          export PATH
          "$fixture/bin/sys/pkg" install 'jq@jq-1.8.2' || exit 91
          set +e
          sh -x "$fixture/m" "$fixture/bin/sys/pkg" install 'jq@jq-1.8.2'
          status=$?
          printf 'SECOND_STATUS=%s\n' "$status"
          exit 0
