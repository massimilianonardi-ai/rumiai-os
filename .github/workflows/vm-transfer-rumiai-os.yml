name: pkg-install-chromium-sandbox-env

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/pkg-install-vm-transfer-20260917

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 8177082a4254774db96d94aff2aff3d971da659f
          path: product
          fetch-depth: 1
          persist-credentials: false

      - name: Install and validate Chromium sandbox environment
        shell: sh
        run: |
          set -eu
          cd product
          git remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          test "$(git rev-parse HEAD)" = 8177082a4254774db96d94aff2aff3d971da659f
          ./m "$PWD/bin/sys/osarch-update"
          test "$(readlink bin/ext-osarch)" = ext-linux-x86_64

          ./m pkg install chromium
          identity=$(./m pkg default chromium)
          [ -n "$identity" ]
          concrete="$PWD/pkg/$identity"
          sandbox="$concrete/root/chrome_sandbox"

          [ -f "$sandbox" ] && [ ! -L "$sandbox" ] && [ -x "$sandbox" ]
          listing=$(LC_ALL=C ls -ldn "$sandbox")
          set -- $listing
          [ "$#" -ge 4 ]
          [ "$3" = 0 ] && [ "$4" = 0 ]
          mode_match=$(find "$sandbox" -prune -perm 4755 -print)
          [ "$mode_match" = "$sandbox" ]

          [ -f "$concrete/env" ] && [ ! -L "$concrete/env" ]
          m_COMMAND_BIN="$concrete/cmd/chromium"
          export m_COMMAND_BIN
          . "$concrete/env"
          [ "$CHROME_DEVEL_SANDBOX" = "$sandbox" ]
          export CHROME_DEVEL_SANDBOX

          ./m chromium --version
          printf 'PASS package=chromium identity=%s sandbox=%s\n' "$identity" "$CHROME_DEVEL_SANDBOX"
