name: vm-transfer-rumiai-os

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/pkg-install-vm-transfer-20260917

jobs:
  validate-readpathce-and-live-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 9e7a67c6406eb2995615f7f53bfe5eedefc9b95b
          path: product
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: cf11db73dc3399ccd8a5e77e071a1984e4b313dd
          path: suite
          fetch-depth: 1
          persist-credentials: false
      - name: Syntax
        shell: sh
        run: |
          set -eu
          sh -n product/m
          sh -n product/lib/sys/sh/core.lib.sh
          sh -n suite/tests/rumiai-os/command/command-bin-canonical.test
          sh -n suite/tests/rumiai-os/pkg/install-live.test
      - name: Command resolution regression
        shell: sh
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/product
        run: |
          set -eu
          git -C product remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          suite/tests/rumiai-os/command/command-bin-canonical.test
      - name: Live pkg install from product root
        shell: sh
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/product
        run: |
          set -eu
          git -C product remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          suite/tests/rumiai-os/pkg/install-live.test
