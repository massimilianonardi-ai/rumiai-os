name: vm-transfer-rumiai-os

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/pkg-install-vm-transfer-20260917

jobs:
  pkg-install-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact rumiai-os revision
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: bc847264d33cbb838d8cdd014f7b15a888d32c8e
          path: product
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact rumiai-tests revision
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: 455fd4688b06996ba44f952c6f84e72024b2fced
          path: suite
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact revisions
        shell: sh
        run: |
          set -eu
          test "$(git -C product rev-parse HEAD)" = "bc847264d33cbb838d8cdd014f7b15a888d32c8e"
          test "$(git -C suite rev-parse HEAD)" = "455fd4688b06996ba44f952c6f84e72024b2fced"
          git -C product remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          sh -n suite/lib/rumiai-os-fixture.lib
          sh -n suite/tests/rumiai-os/pkg/install-live.test

      - name: Run real pkg install test
        shell: sh
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/product
          TMPDIR: ${{ runner.temp }}
        run: suite/tests/rumiai-os/pkg/install-live.test
