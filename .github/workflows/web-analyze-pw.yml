name: Web Analyze Playwright

on:
  push:
    paths:
      - "lib/sys/js/web-analyze-pw.lib.js"
      - "res/sys/manual/web-analyze-pw.lib.js"
      - ".github/workflows/web-analyze-pw.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Syntax, API and argument checks
        shell: sh
        run: |
          set -eu
          node --check lib/sys/js/web-analyze-pw.lib.js
          node -e '
          const lib = require("./lib/sys/js/web-analyze-pw.lib.js");
          if (typeof lib.webAnalyzePw !== "function" || typeof lib.webAnalyzePwMain !== "function") process.exit(1);
          lib.webAnalyzePwMain([]).then(status => process.exit(status === 1 ? 0 : 2));
          '

      - name: Install upstream Playwright and Chromium
        shell: sh
        run: |
          set -eu
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.63.0
          # Deliberately use a browser cache outside Node's default HOME.
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-owned-browsers" \
            ./node_modules/.bin/playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/playwright-bin"
          printf '%s\n' '#!/bin/sh' \
            'PLAYWRIGHT_BROWSERS_PATH="'$RUNNER_TEMP'/pw-owned-browsers"' \
            'export PLAYWRIGHT_BROWSERS_PATH' \
            'exec "'$GITHUB_WORKSPACE'/node_modules/.bin/playwright" "$@"' \
            > "$RUNNER_TEMP/playwright-bin/playwright"
          chmod +x "$RUNNER_TEMP/playwright-bin/playwright"

      - name: Verify CLI-owned browser cache survives Node package isolation
        shell: sh
        run: |
          set -eu
          export PATH="$RUNNER_TEMP/playwright-bin:$PATH"
          unset PLAYWRIGHT_BROWSERS_PATH
          node -e '
            const api = require("./lib/sys/js/web-analyze-pw.lib.js");
            api.webAnalyzePw({
              url: "http://127.0.0.1:1/",
              output: process.argv[1],
              headless: true,
              maxSteps: 1,
              settleMs: 100
            }).then(() => { console.error("unexpected navigation success"); process.exitCode=1; },
            e => {
              if (e.id !== "navigation-failed") {
                console.error("browser did not reach navigation", e);
                process.exitCode=1;
              }
            });
          ' "$RUNNER_TEMP/pw-cache-regression"
          summary=$(find "$RUNNER_TEMP/pw-cache-regression" -name summary.json -type f -print -quit)
          test -n "$summary"
          node -e '
            const s = require(process.argv[1]);
            if (s.failure?.id !== "navigation-failed") process.exit(1);
            const events = require("node:fs").readFileSync(process.argv[2], "utf8");
            if (!events.includes("navigation-failed")) process.exit(1);
          ' "$summary" "${summary%/summary.json}/events.jsonl"

      - name: Analyze real locally served scrollable page
        shell: sh
        run: |
          set -eu
          export PATH="$RUNNER_TEMP/playwright-bin:$PATH"
          node -e '
            const http = require("node:http");
            const html = "<html><head><title>PW deep scan fixture</title></head><body><div style=\"height:500px; overflow-y:auto\"><main style=\"height:3500px\"><h1>Nested long document</h1></main></div><script>console.log(\"fixture ready\");setTimeout(()=>{document.querySelector(\"h1\").textContent=\"DOM mutated\"},100);</script></body></html>";
            http.createServer((req,res)=>{res.setHeader("Content-Type","text/html");res.end(html)}).listen(18765,"127.0.0.1");
          ' &
          server=$!
          trap 'kill "$server" 2>/dev/null || :' 0
          node -e '
            const a = require("./lib/sys/js/web-analyze-pw.lib.js");
            a.webAnalyzePw({url:"http://127.0.0.1:18765/", output:process.argv[1], headless:true, maxSteps:3, settleMs:150})
            .then(r => process.stdout.write(r.output+"\\n"), e => {console.error(e);process.exitCode=1;});
          ' "$RUNNER_TEMP/web-analyze-pw-fixture"
          summary=$(find "$RUNNER_TEMP/web-analyze-pw-fixture" -name summary.json -type f -print -quit)
          test -n "$summary"
          run_dir=${summary%/summary.json}
          test -s "$run_dir/events.jsonl"
          test -s "$run_dir/0000-initial.html"
          test -s "$run_dir/0000-initial.png"
          test -s "$run_dir/trace.zip"
          node -e '
            const s = require(process.argv[1]);
            if (s.failure || s.captures.length < 2 || s.eventCount < 5) process.exit(1);
          ' "$summary"

      - name: Attempt target ChatGPT share analysis
        continue-on-error: true
        shell: sh
        run: |
          set -eu
          export PATH="$RUNNER_TEMP/playwright-bin:$PATH"
          timeout 180 node -e '
            const a = require("./lib/sys/js/web-analyze-pw.lib.js");
            a.webAnalyzePw({
              url:"https://chatgpt.com/share/6ad1c0d5-49ec-83eb-a79b-85b04b938835",
              output:process.argv[1],
              headless:true,
              maxSteps:6,
              settleMs:500
            }).catch(e => {console.error(e); process.exitCode=1;});
          ' "$RUNNER_TEMP/web-analyze-pw-chatgpt"
          summary=$(find "$RUNNER_TEMP/web-analyze-pw-chatgpt" -name summary.json -type f -print -quit)
          test -n "$summary"
          test -s "$summary"
