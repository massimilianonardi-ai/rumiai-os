name: Native Chromium web-analyze resource capture

on:
  push:
    paths:
      - 'bin/sys/web-analyze'
      - 'res/sys/manual/web-analyze'
      - 'lib/sys/js/web-analyze.lib.js'
      - 'lib/sys/js/web-analyze-rest.lib.js'
      - 'res/sys/manual/web-analyze-rest.lib.js'
      - 'res/sys/manual/web-analyze.lib.js'
      - '.github/workflows/web-analyze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: 2ee5c24cfc5909e505e3fd2214a5648b5a03664f
          path: .web-analyze-tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise native CDP archive against real Chromium
        shell: bash
        run: |
          set -eu
          node --check lib/sys/js/web-analyze.lib.js
          node --check lib/sys/js/web-analyze-rest.lib.js
          node --check bin/sys/web-analyze
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          mkdir -p "$RUNNER_TEMP/web-analyze-bin"
          cat > "$RUNNER_TEMP/web-analyze-bin/chromium" <<EOF
          #!/bin/sh
          exec "$browser" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/web-analyze-bin/chromium"
          export PATH="$RUNNER_TEMP/web-analyze-bin:$PATH"
          export RUMIAI_TEST_RUMIAI_OS_ROOT="$GITHUB_WORKSPACE"
          git remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          sh ./.web-analyze-tests/tests/rumiai-os/web-analyze/inactive-service-worker.test
          sh ./.web-analyze-tests/tests/rumiai-os/web-analyze/web-analyze.test
          sh ./.web-analyze-tests/tests/rumiai-os/web-analyze/command.test
          sh ./.web-analyze-tests/tests/rumiai-os/web-analyze/oopif.test
      - name: Exercise real verified HTTPS and browser certificate-chain capture
        shell: bash
        run: |
          set -eu
          if ! command -v certutil >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libnss3-tools
          fi
          command -v openssl
          export PATH="$RUNNER_TEMP/web-analyze-bin:$PATH"
          export RUMIAI_TEST_RUMIAI_OS_ROOT="$GITHUB_WORKSPACE"
          # External validation setup owns the disposable user environment.
          export HOME="$RUNNER_TEMP/web-analyze-tls-home"
          mkdir -p "$HOME"
          chmod 700 "$HOME"
          export RUMIAI_TEST_TLS_EPHEMERAL_HOME="$HOME"
          sh ./.web-analyze-tests/tests/rumiai-os/web-analyze/https.test
