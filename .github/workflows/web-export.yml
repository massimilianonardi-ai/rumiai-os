name: Standalone web-export with real Chromium

on:
  push:
    paths:
      - 'bin/sys/web-export'
      - 'res/sys/manual/web-export'
      - '.github/workflows/web-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: 4145fa8cdee162f9ba0e76baf5380fa72b6540b9
          path: .web-export-tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise public command and offline output in Chromium
        shell: bash
        run: |
          set -eu
          node --check bin/sys/web-export
          node --check .web-export-tests/tests/rumiai-os/web-export/.support/command.js
          sh -n .web-export-tests/tests/rumiai-os/web-export/web-export.test
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          mkdir -p "$RUNNER_TEMP/web-export-bin"
          cat > "$RUNNER_TEMP/web-export-bin/chromium" <<EOF
          #!/bin/sh
          exec "$browser" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/web-export-bin/chromium"
          export PATH="$RUNNER_TEMP/web-export-bin:$PATH"
          git remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          export RUMIAI_TEST_RUMIAI_OS_ROOT="$GITHUB_WORKSPACE"
          sh ./.web-export-tests/tests/rumiai-os/web-export/web-export.test
